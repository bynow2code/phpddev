services:

  mysql:
    image: mysql:8.0.45
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev_net

  redis:
    image: redis:7.0.15
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev_net

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 不要使用 guest 用户：guest 默认仅允许 localhost 连接，容器间无法访问
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP 协议端口
      - "127.0.0.1:15672:15672"   # Web 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev_net

  core:
    build:
      context: php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PHP_IDE_CONFIG: "serverName=core.test"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    expose:
      - "9000"
    volumes:
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway" # 原生 docker 不支持 host.docker.internal 解析，需要使用 extra_hosts 指定
    networks:
      - dev_net
    working_dir: /usr/share/nginx/html/core

  oms:
    build:
      context: php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PHP_IDE_CONFIG: "serverName=oms.test"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    expose:
      - "9000"
    volumes:
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway" # 原生 docker 不支持 host.docker.internal 解析，需要使用 extra_hosts 指定
    networks:
      - dev_net
    working_dir: /usr/share/nginx/html/oms

  wms:
    build:
      context: php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PHP_IDE_CONFIG: "serverName=wms.test"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    expose:
      - "9000"
    volumes:
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway" # 原生 docker 不支持 host.docker.internal 解析，需要使用 extra_hosts 指定
    networks:
      - dev_net
    working_dir: /usr/share/nginx/html/wms

  pms:
    build:
      context: php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PHP_IDE_CONFIG: "serverName=pms.test"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    expose:
      - "9000"
    volumes:
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway" # 原生 docker 不支持 host.docker.internal 解析，需要使用 extra_hosts 指定
    networks:
      - dev_net
    working_dir: /usr/share/nginx/html/pms

  mg:
    build:
      context: php
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PHP_IDE_CONFIG: "serverName=mg.test"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    expose:
      - "9000"
    volumes:
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway" # 原生 docker 不支持 host.docker.internal 解析，需要使用 extra_hosts 指定
    networks:
      - dev_net
    working_dir: /usr/share/nginx/html/mg

  nginx:
    image: nginx:1.24.0
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ${PROJECT_ROOT}:/usr/share/nginx/html:cached
    depends_on:
      - core
      - oms
      - wms
      - pms
      - mg
    ports:
      - "80:80"
    networks:
      dev_net:
        aliases:
          - core.test
          - oms.test
          - wms.test
          - pms.test
          - mg.test

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  dev_net:
    driver: bridge